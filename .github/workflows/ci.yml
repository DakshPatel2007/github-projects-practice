name: CI Workflow - Docker

on:
  push:
    branches:
      - main

# Allow the job to push the updated index.html back to the repo
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Check out the repository code onto the runner
      - name: Checkout repository
        uses: actions/checkout@v2

      # Give the copied .git folder credentials so git push works inside the container
      - name: Configure git remote with token
        run: git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      # Build the Docker image from the Dockerfile in the repo root
      - name: Build the Docker image
        run: docker build -t task-manager:latest .

      # Run the container (runs todo.py, todo-test.py, then update_index.sh)
      - name: Run the Docker image
        run: docker run --rm -e GITHUB_USER="${{ github.actor }}" task-manager:latest
